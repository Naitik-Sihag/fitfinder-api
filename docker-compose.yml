services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitfinder}
      POSTGRES_DB: fitfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FITFINDER_DATABASE_URL: postgresql+asyncpg://fitfinder:${POSTGRES_PASSWORD:-fitfinder}@db:5432/fitfinder
      FITFINDER_API_KEYS: ${FITFINDER_API_KEYS:-}
      FITFINDER_SEED_DEMO_DATA: ${FITFINDER_SEED_DEMO_DATA:-true}
      FITFINDER_CORS_ORIGINS: ${FITFINDER_CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
